<!DOCTYPE html>
<html>
<head><meta charset="utf-8"><title>Profile – Example App</title>
<style>
  body { font-family: sans-serif; max-width: 500px; margin: 80px auto; padding: 0 20px; }
  .card { background: #f5f5f5; border-radius: 6px; padding: 24px; }
  .card p { margin: 8px 0; }
  a { color: #0066cc; }
</style>
</head>
<body>
  <h2>Your Profile</h2>
  <div class="card">
    <p><strong>User ID:</strong> {{ user.id }}</p>
    <p><strong>Username:</strong> {{ user.username }}</p>
  </div>
  <br>
  <a href="/">← Home</a> &nbsp; <a href="/logout">Logout</a>
</body>
</html>
