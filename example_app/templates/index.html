<!DOCTYPE html>
<html>
<head><meta charset="utf-8"><title>Example App – FybeAuth Demo</title>
<style>
  body { font-family: sans-serif; max-width: 600px; margin: 80px auto; padding: 0 20px; }
  .btn { display: inline-block; padding: 12px 28px; background: #0066cc; color: #fff;
         text-decoration: none; border-radius: 4px; font-size: 16px; }
  .error { color: red; background: #fff0f0; padding: 10px; border-radius: 4px; }
</style>
</head>
<body>
  <h1>Example OAuth2 Client App</h1>
  <p>This app demonstrates the <strong>Authorization Code</strong> flow using FybeAuth.</p>

  {% if error %}
    <p class="error">{{ error }}</p>
  {% endif %}

  {% if user %}
    <p>✅ You are logged in as <strong>{{ user.username }}</strong>.</p>
    <p><a href="/profile">View Profile</a> &nbsp; <a href="/logout">Logout</a></p>
  {% else %}
    <p><a class="btn" href="/login">Login with FybeAuth</a></p>
  {% endif %}
</body>
</html>
