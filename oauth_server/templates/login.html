<!DOCTYPE html>
<html>
<head><meta charset="utf-8"><title>Login – FybeAuth</title>
<style>
  body { font-family: sans-serif; max-width: 400px; margin: 80px auto; padding: 0 20px; }
  input { width: 100%; padding: 8px; margin: 8px 0; box-sizing: border-box; }
  button { width: 100%; padding: 10px; background: #0066cc; color: #fff; border: none; cursor: pointer; }
  .error { color: red; }
</style>
</head>
<body>
  <h2>Login to FybeAuth</h2>
  {% if error %}<p class="error">{{ error }}</p>{% endif %}
  <form method="post" action="/login?next={{ next | urlencode }}">
    <input name="username" placeholder="Username" required>
    <input name="password" type="password" placeholder="Password" required>
    <button type="submit">Login</button>
  </form>
  <p>Don't have an account? <a href="/register">Register</a></p>
</body>
</html>
