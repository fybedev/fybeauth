<!DOCTYPE html>
<html>
<head><meta charset="utf-8"><title>Client Created – FybeAuth</title>
<style>
  body { font-family: sans-serif; max-width: 600px; margin: 80px auto; padding: 0 20px; }
  .box { background: #f5f5f5; padding: 20px; border-radius: 4px; }
  code { word-break: break-all; }
  .warn { color: #c00; font-weight: bold; }
</style>
</head>
<body>
  <h2>Client Registered!</h2>
  <p class="warn">⚠ Save these credentials now – the secret will not be shown again.</p>
  <div class="box">
    <p><strong>Client ID:</strong><br><code>{{ client.client_id }}</code></p>
    <p><strong>Client Secret:</strong><br><code>{{ client.client_secret }}</code></p>
    <p><strong>Redirect URIs:</strong><br>
      {% for uri in client.redirect_uris %}
        <code>{{ uri }}</code><br>
      {% endfor %}
    </p>
    <p><strong>Scopes:</strong> {{ client.scope }}</p>
  </div>
  <br>
  <a href="/clients">← Back to clients</a>
</body>
</html>
