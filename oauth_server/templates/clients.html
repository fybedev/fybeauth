<!DOCTYPE html>
<html>
<head><meta charset="utf-8"><title>OAuth2 Clients – FybeAuth</title>
<style>
  body { font-family: sans-serif; max-width: 700px; margin: 60px auto; padding: 0 20px; }
  input, select { width: 100%; padding: 8px; margin: 6px 0; box-sizing: border-box; }
  button { padding: 10px 20px; background: #0066cc; color: #fff; border: none; cursor: pointer; }
  table { width: 100%; border-collapse: collapse; margin-top: 20px; }
  th, td { text-align: left; padding: 8px; border-bottom: 1px solid #ddd; }
  code { background: #f5f5f5; padding: 2px 5px; border-radius: 3px; font-size: 13px; }
</style>
</head>
<body>
  <h2>OAuth2 Clients</h2>
  <p>Logged in as <strong>{{ user.username }}</strong> | <a href="/logout">Logout</a></p>

  <h3>Register New Client</h3>
  <form method="post">
    <input name="client_name" placeholder="Application name" required>
    <input name="client_uri" placeholder="Application homepage URL">
    <input name="redirect_uris" placeholder="Redirect URIs (space separated)" required>
    <input name="scope" placeholder="Scopes (e.g. profile)" value="profile">
    <button type="submit">Register Client</button>
  </form>

  {% if clients %}
  <h3>Your Clients</h3>
  <table>
    <tr><th>Name</th><th>Client ID</th></tr>
    {% for c in clients %}
    <tr>
      <td>{{ c.client_name }}</td>
      <td><code>{{ c.client_id }}</code></td>
    </tr>
    {% endfor %}
  </table>
  {% endif %}
</body>
</html>
