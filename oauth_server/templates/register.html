<!DOCTYPE html>
<html>
<head><meta charset="utf-8"><title>Register – FybeAuth</title>
<style>
  body { font-family: sans-serif; max-width: 400px; margin: 80px auto; padding: 0 20px; }
  input { width: 100%; padding: 8px; margin: 8px 0; box-sizing: border-box; }
  button { width: 100%; padding: 10px; background: #0066cc; color: #fff; border: none; cursor: pointer; }
  .error { color: red; }
</style>
</head>
<body>
  <h2>Create an Account</h2>
  {% if error %}<p class="error">{{ error }}</p>{% endif %}
  <form method="post">
    <input name="username" placeholder="Username" required>
    <input name="password" type="password" placeholder="Password" required>
    <button type="submit">Register</button>
  </form>
  <p>Already have an account? <a href="/login">Login</a></p>
</body>
</html>
